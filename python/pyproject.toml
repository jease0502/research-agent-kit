[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-kit"
version = "0.0.1"
description = "Markdown knowledge base tooling (schema, check, build, add-paper) for research agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6.0,<7",
  "Markdown>=3.11,<3.12",  # 3.11 keeps `A*` literal where 3.10 opened emphasis; tests pin it
  # add-paper only: some OS trust stores miss intermediate certs on the arXiv chain
  "certifi",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rak = "rak.cli:main"

[tool.setuptools]
packages = ["rak"]

[tool.setuptools.package-data]
rak = ["web/*", "web/assets/*", "web/assets/vendor/katex/*", "web/assets/vendor/katex/fonts/*", "templates/*/*.md", "model_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
